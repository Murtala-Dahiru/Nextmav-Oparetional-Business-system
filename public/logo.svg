<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="NextMav">
  <!--
    The NextMav mark.

    This file previously held the Z.ai/ChatGLM logo that shipped with the
    project scaffold — a third party's mark, served as this product's favicon.
    It was moved off their CDN into `public/` at some point, which fixed where
    it was hosted and not what it was.

    The form is an N whose final stem overshoots into an arrow: the letter and
    the direction in one stroke. Monoline at 2.75 so it survives 16px,
    geometric so it never needs a "simplified small" variant.
  -->
  <rect width="32" height="32" rx="8" fill="#111318"/>
  <g fill="none" stroke="#3DBFA6" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 22.5V11"/>
    <path d="M11 11l10 11.5"/>
    <path d="M21 22.5V9.5"/>
    <path d="M17.6 12.9 21 9.5l3.4 3.4"/>
  </g>
</svg>
